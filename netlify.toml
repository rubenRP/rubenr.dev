[build]
  command = "npm run build"
  publish = "dist"

# First-party proxy for Umami so ad blockers that match "umami" do not drop the tracker.
[[redirects]]
  from = "/stats/script.js"
  to = "https://umami.rubenr.dev/script.js"
  status = 200
  force = true

[[redirects]]
  from = "/stats/api/*"
  to = "https://umami.rubenr.dev/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
